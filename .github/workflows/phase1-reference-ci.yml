name: Phase 1 reference contracts and SQL

on:
  push:
    branches:
      - feature/phase1-stored-reports
      - security/hardening-phase1-20261111
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java-and-react:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Backend unit tests
        run: mvn -B -ntp -f backend/pom.xml test
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend dependency install
        run: npm ci --prefix frontend
      - name: Frontend build
        run: npm run build --prefix frontend

  postgres-18-smoke:
    runs-on: ubuntu-latest
    services:
      pg:
        image: postgres:18
        env:
          POSTGRES_DB: phase1_smoke
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d phase1_smoke"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Seed synthetic-only BSS fixtures
        run: |
          docker exec -i ${{ job.services.pg.id }} psql -X -v ON_ERROR_STOP=1 -U postgres -d phase1_smoke < database/reports/tests/LEGACY_REFERENCE_SMOKE_FIXTURE.sql
      - name: Create report-only source and payment functions
        run: |
          docker exec -i ${{ job.services.pg.id }} psql -X -v ON_ERROR_STOP=1 -U postgres -d phase1_smoke < database/reports/00_PHASE1_REFERENCE_CORE.sql
          docker exec -i ${{ job.services.pg.id }} psql -X -v ON_ERROR_STOP=1 -U postgres -d phase1_smoke < database/reports/00B_PHASE1_PAYMENT_SOURCE.sql
          docker exec -i ${{ job.services.pg.id }} psql -X -v ON_ERROR_STOP=1 -U postgres -d phase1_smoke < database/reports/01_PHASE1_LEGACY_REPORTS.sql
          docker exec -i ${{ job.services.pg.id }} psql -X -v ON_ERROR_STOP=1 -U postgres -d phase1_smoke < database/reports/02_PHASE1_ENTRYPOINTS.sql
      - name: Verify twelve reports on fake data
        run: |
          docker exec -i ${{ job.services.pg.id }} psql -X -v ON_ERROR_STOP=1 -U postgres -d phase1_smoke < database/reports/tests/LEGACY_REFERENCE_SMOKE_ASSERT.sql
      - name: Verify five monthly revenue trends
        run: |
          docker exec -i ${{ job.services.pg.id }} psql -X -v ON_ERROR_STOP=1 -U postgres -d phase1_smoke < database/reports/tests/REVENUE_TREND_SMOKE_ASSERT.sql
      - name: Verify transaction-local database timeout
        run: |
          docker exec -i ${{ job.services.pg.id }} psql -X -v ON_ERROR_STOP=1 -U postgres -d phase1_smoke < database/security/tests/TRANSACTION_LOCAL_TIMEOUT_ASSERT.sql
